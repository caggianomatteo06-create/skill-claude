<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aula — lezioni e appunti</title>
<meta name="description" content="Registra le lezioni, trascrivile, prendi appunti e collega foto, link e file. Tutto nel browser.">
<meta name="theme-color" content="#2f5d50">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Navigazione">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="currentColor"/><path d="M10 21V11l6 4 6-4v10" stroke="var(--bg)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Aula</span>
      <button class="icon only-mobile" id="closeSide" aria-label="Chiudi menu">✕</button>
    </div>
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="q" type="search" placeholder="Cerca ovunque… (Ctrl+K)" autocomplete="off">
    </label>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button id="syncPill" class="pill" title="Sincronizzazione"></button>
      <button id="openSettings" class="ghost">⚙ Impostazioni</button>
    </div>
  </aside>
  <div id="scrim"></div>
  <main id="main" tabindex="-1"></main>
</div>

<div id="recbar" hidden>
  <span class="dot"></span>
  <button id="recGo" class="link"></button>
  <span id="recTime">0:00</span>
  <span id="recLevel"><i></i></span>
  <button id="recMark" title="Segna momento importante (Alt+M)">⭐ Segna</button>
  <button id="recPause">Pausa</button>
  <button id="recStop" class="danger">■ Stop</button>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="lightbox" hidden></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="filePick" hidden multiple>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
